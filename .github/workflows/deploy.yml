name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # for AWS OIDC
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install the AWS CDK CLI
        run: npm install -g aws-cdk@2.190.0 # matches aws-cdk-lib in cdk/pyproject.toml

      - uses: astral-sh/setup-uv@v3

      - name: Install Python workspace dependencies
        run: uv sync --all-packages

      - name: Lint Python workspace
        run: uv run ruff check .

      - name: Test backend
        working-directory: backend
        run: uv run pytest -q

      - name: Check Lambda layer requirements are in sync with uv.lock
        run: bash scripts/check-layer-requirements.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy (cdk deploy)
        working-directory: cdk
        run: uv run cdk deploy --all --require-approval never
