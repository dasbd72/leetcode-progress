[project]
name = "scraper"
version = "0.0.0"
description = "LeetCode progress scraper (AWS Lambda)"
requires-python = ">=3.10,<3.11"
# Runtime dependencies — exported to layer/requirements.txt and bundled into
# the Lambda layer. Keep in sync via `uv export` (pre-commit hook).
dependencies = [
    "requests",
    "boto3",
]

[tool.uv]
package = false
