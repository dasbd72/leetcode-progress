repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-aws-credentials
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
        # tsconfig.*.json and editor .vscode/*.json are JSONC (comments /
        # trailing commas), which the strict JSON check cannot parse.
        exclude: '(\.vscode/.*\.json|tsconfig.*\.json)$'
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: uv-export-layers
        name: uv export Lambda layer requirements
        entry: scripts/check-layer-requirements.sh
        language: system
        pass_filenames: false
        files: ^(uv\.lock|backend/pyproject\.toml|scraper/pyproject\.toml|backend/layer/requirements\.txt|scraper/layer/requirements\.txt)$
